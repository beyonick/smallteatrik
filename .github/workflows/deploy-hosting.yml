name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOSTING_PROTOCOL: ${{ vars.HOSTING_PROTOCOL || 'sftp' }}
      HOSTING_HOST: ${{ vars.HOSTING_HOST }}
      HOSTING_USER: ${{ vars.HOSTING_USER }}
      # Папка сайта на хостинге называется как репозиторий — задавать вручную нужно только если это не так.
      HOSTING_DIR: ${{ vars.HOSTING_DIR || format('{0}/public_html', github.event.repository.name) }}
      HOSTING_PASSWORD: ${{ secrets.HOSTING_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y -qq lftp
      - run: bash .github/deploy-hosting.sh --upload
